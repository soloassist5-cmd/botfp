# MrCrayfish's Vehicle Mod: настройки для города.
# Файл копируется в мир при первом запуске (serverconfig/vehicle-server.toml),
# дальше его можно править там.

[general]
	# Бензин нужен: канистру покупают на заправке, правый клик по машине
	# заливает полный бак.
	fuelEnabled = true
	# Машины не ломаются: ремонта в городе нет, и так задумано.
	vehicleDamage = false
	# Машину можно подобрать (присесть + правый клик пустой рукой).
	pickUpVehicles = true
	# Расход топлива вдвое меньше стандартного: полного бака хватает на город.
	fuelConsumptionModifier = 0.5
