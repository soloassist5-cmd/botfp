
#City Life — телефоны, банк и умные замки
[general]
	#Стартовый баланс банковского счёта нового игрока.
	#Range: 0 ~ 1000000000
	startingBalance = 500
	#На каком расстоянии телефон управляет привязанным замком.
	#Range: 8 ~ 512
	phoneLockRange = 64
	#Сколько меток можно хранить в приложении «Карта».
	#Range: 1 ~ 64
	maxWaypoints = 12
	#Сколько последних сообщений хранится у игрока.
	#Range: 5 ~ 500
	maxMessages = 50
	#Экстренный вызов 112 виден всем игрокам.
	#Выключи, если на сервере есть отдельная роль полиции (тогда видят только операторы).
	emergencyToEveryone = true

#Умные замки
[locks]
	#Шанс вскрыть замок отмычкой за одну попытку.
	#Range: 0.0 ~ 1.0
	lockpickChance = 0.25
	#Через сколько тиков замок закрывается сам (20 тиков = 1 секунда).
	#Range: 20 ~ 12000
	lockAutoCloseTicks = 120
	#Поднимать тревогу и уведомлять владельца при неудачном вскрытии.
	lockpickAlarm = true

