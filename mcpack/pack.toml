# ============================================================================
#  LS: City Life — единый источник истины для сборки.
#  Всё остальное (манифесты лаунчеров, установщики, серверный пак)
#  генерируется из этого файла скриптами в build/.
# ============================================================================

[pack]
name        = "LS City Life"
id          = "ls-city-life"
version     = "1.0.0"
summary     = "Современный город в духе Лос-Анджелеса: огнестрел, экономика, телефоны, камеры, умные замки и NPC."
minecraft   = "1.20.1"
loader      = "forge"
# Версия Forge. Менять только вместе с проверкой всего списка модов.
loader_version = "47.4.23"
java        = 17

[requirements]
ram_min_mb     = 4096
ram_rec_mb     = 6144
disk_mb        = 4096
# Прорисовка по умолчанию; Distant Horizons дорисовывает силуэт города дальше.
render_distance = 12
dh_distance     = 96

# ----------------------------------------------------------------------------
#  Локальные (самописные) моды: не скачиваются, лежат в репозитории.
# ----------------------------------------------------------------------------
[[local_mods]]
id    = "citylife"
file  = "mods-local/citylife-1.20.1-1.0.0.jar"
side  = "both"
group = "core"
note  = "Самописный мод: смартфоны с 6 приложениями и умные замки"

# ----------------------------------------------------------------------------
#  Моды с Modrinth. side: both | client | server
#  group: core | deco | qol | perf | lib
#  Обязательные зависимости резолвер подтянет сам.
# ----------------------------------------------------------------------------

