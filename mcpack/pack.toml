# Машины — MrCrayfish's Vehicle Mod (неофициальный порт на 1.20.1).
# Ultimate Car Mod убран: в игре он оказался неудобным. Здесь техника приходит
# целиком в ящике, ящик вскрывается гаечным ключом, 28 видов: от мопеда до
# микроавтобуса, катера и вертолёта. Автосалон продаёт готовые ящики с мотором
# и колёсами, заправка — канистры; ремонт отключён в конфиге.
[[mods]]
slug = "mrcrayfishs-vehicle-unofficial"
side  = "both"
group = "core"
note = "Машины целиком в ящике: вскрыл ключом — поехал. 28 видов техники"

[[mods]]
slug = "traffic-control-+-roads-mod-by-teerth"
side  = "both"
group = "core"
note = "Дороги, разметка, светофоры, знаки, отбойники"

[[mods]]
