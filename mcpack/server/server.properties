# ===========================================================================
#  LS City Life — сервер для игры с друзьями (в том числе через Radmin VPN).
#
#  online-mode=false обязателен, если кто-то из друзей играет с пиратского
#  лаунчера. Минус: на такой сервер может зайти любой, кто знает адрес,
#  поэтому не свети IP и держи white-list включённым.
# ===========================================================================
level-name=world
motd=§bLos Santos §7| City Life
online-mode=false
white-list=true
enforce-whitelist=true
max-players=8
difficulty=normal
gamemode=survival
force-gamemode=false
pvp=true
allow-flight=true
spawn-protection=0
enable-command-block=true
# Город плотный: большая прорисовка на сервере бьёт по нему сильнее, чем по клиенту.
view-distance=8
simulation-distance=6
max-tick-time=120000
# Порт по умолчанию; в Radmin VPN друзья подключаются по адресу вида 26.x.x.x:25565
server-port=25565
# Пусто = слушать все интерфейсы, включая адрес Radmin VPN.
server-ip=
sync-chunk-writes=false
entity-broadcast-range-percentage=80
