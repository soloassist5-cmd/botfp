# Скопируйте этот файл в config.toml и заполните под себя.
# config.toml добавлен в .gitignore — в репозиторий он попасть не должен.

[funpay]
# Cookie golden_key вашего аккаунта FunPay.
# Это полный доступ к аккаунту. Лучше не писать его сюда, а передавать
# через переменную окружения FUNPAY_GOLDEN_KEY — она имеет приоритет.
golden_key = ""

# User-Agent того же браузера, из которого взят golden_key.
# Если он не совпадает, FunPay чаще сбрасывает сессию.
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36"

[bot]
# Файл базы. Внутри лежит товар в открытом виде — храните рядом с ботом,
# на диске с правами 0600 (бот выставляет их сам при создании).
db_path = "botfp.db"

# Ники продавцов на FunPay, которым бот шлёт уведомления и которые могут
# вызывать !стат и !ожидают прямо в чате.
admins = ["ВашНикНаFunPay"]

# Пауза между опросами FunPay, секунды. Меньше 2 ставить нельзя — прилетит 429.
poll_interval = 4.0

# Задержка между запросами внутри FunPayAPI, секунды.
request_delay = 1.0

# Пауза между правками объявлений, секунды. Пачка правок без пауз выглядит
# как флуд, поэтому меньше 1 конфиг не примет.
listing_delay = 3.0

# Синхронизировать объявления при запуске бота.
# По умолчанию выключено: создание лотов меняет витрину магазина, и первый
# раз это стоит делать руками через `botfp lots sync --apply`, глядя на результат.
sync_listings_on_start = false

# Когда остаток опускается до этого значения, бот пишет продавцу.
low_stock_threshold = 3

# Добавлять ли к выдаче вежливую просьбу об отзыве.
# Просьба идёт ПОСЛЕ выдачи и ни на что не влияет: товар покупатель
# получает целиком независимо от того, оставит он отзыв или нет.
ask_for_review = true

# ---------------------------------------------------------------------------
# ЛОТЫ
#
# id    — внутренний ключ (он же в `botfp stock add --lot`).
# kind  — "unique" или "unlimited":
#           unique    — каждая единица своя и списывается при продаже
#                       (аккаунты, ключи). Товар грузится через `stock add`.
#           unlimited — один и тот же товар уходит всем покупателям
#                       (гайд, ссылка, файл). Товар лежит прямо здесь.
# match — подстроки, по которым описание заказа с FunPay сопоставляется с
#         лотом: в событии о заказе FunPay присылает только текст, без id.
#         Проверьте match на реальном названии лота, иначе заказ не опознается.
#
# Секция [lots.listing] нужна только для автосоздания объявления.
# Без неё лот работает на выдачу, но витрину бот не трогает.
# ---------------------------------------------------------------------------

# --- Уникальный товар: каждая единица продаётся один раз --------------------
[[lots]]
id = "starter"
title = "Стартовый аккаунт"
kind = "unique"
match = ["Стартовый аккаунт", "starter account"]
instructions = """Как войти:
1. Откройте страницу входа и введите логин и пароль выше.
2. Сразу смените пароль в настройках — это важно.
3. Если что-то не подошло, напишите мне в этот чат, решим."""

  [lots.listing]
  # id подкатегории FunPay. Его видно в адресе страницы категории:
  # funpay.com/lots/1234/  ->  node_id = 1234
  node_id = 1234
  price = 1.0
  short_description = "Стартовый аккаунт | моментальная выдача"
  description = "Выдача автоматическая, сразу после оплаты. Отвечаю на вопросы в чате."
  # Снимать объявление с витрины, когда товар кончился, и возвращать после
  # пополнения. Так покупатель не оформит заказ на то, чего нет.
  auto_deactivate = true

# --- Безлимитный товар: гайд, ссылка, файл ---------------------------------
[[lots]]
id = "guide-standoff"
title = "Гайд по Standoff 2"
kind = "unlimited"
match = ["Гайд по Standoff 2", "standoff guide"]
# Что уходит покупателю. Либо payload прямо здесь, либо payload_file с путём
# к файлу рядом с конфигом.
payload = "https://docs.google.com/document/d/ВАША-ССЫЛКА"
# payload_file = "guides/standoff.txt"
instructions = "Ссылка постоянная, доступ по ней не пропадёт."

  [lots.listing]
  node_id = 5678
  price = 1.0
  short_description = "Гайд по Standoff 2 | мгновенно"
  description = "Ссылка приходит автоматически сразу после оплаты."
